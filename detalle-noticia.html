<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASATEME - Noticia</title>

    <link rel="icon" type="image/png" href="assets/images/logo-asateme.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        asatemeBlue: '#003366',
                        asatemeRed: '#D32F2F',
                        asatemeGray: '#F1F5F9',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-asatemeGray font-sans text-gray-800 leading-relaxed">

    <nav class="bg-asatemeBlue text-white sticky top-0 z-50 shadow-xl">
        <div class="container mx-auto px-4 md:px-6 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-3">
                    <img src="assets/images/logo-asateme.png" alt="Logo ASATEME" class="h-12 w-auto object-contain">
                    <div>
                        <h1 class="text-xl md:text-2xl font-extrabold tracking-wide leading-none">ASATEME</h1>
                        <span class="text-xs text-gray-300 uppercase tracking-widest">Asociación Santafesina de Tenis de
                            Mesa</span>
                    </div>
                </a>
            </div>

            <div class="hidden lg:flex space-x-6 font-semibold text-sm items-center">
                <a href="index.html#noticias" class="hover:text-asatemeRed transition duration-300">Noticias</a>
                <a href="index.html#destacados" class="hover:text-asatemeRed transition duration-300">Destacados</a>
                <a href="index.html#ranking" class="hover:text-asatemeRed transition duration-300">Ranking</a>
                <a href="index.html#calendario" class="hover:text-asatemeRed transition duration-300">Calendario</a>
            </div>

            <div class="flex items-center gap-3">
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSdBdc_petoieFpV5CcZYIEc4iv2BKG_uIGpsRVDu0iIV0ELyg/viewform?usp=header#afiliaciones"
                    target="_blank" rel="noopener noreferrer"
                    class="bg-asatemeRed hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold transition shadow-md text-sm flex items-center gap-1">
                    <i class="fas fa-user-plus"></i> Afiliate
                </a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 md:px-6 py-10 max-w-4xl">

        <div class="mb-6">
            <a href="index.html#noticias"
                class="text-asatemeBlue hover:text-asatemeRed font-bold text-sm inline-flex items-center gap-2 transition">
                <i class="fas fa-arrow-left"></i> Volver a Noticias
            </a>
        </div>

        <div id="error-container" class="hidden bg-white p-8 rounded-2xl shadow-md text-center border border-gray-100">
            <i class="fas fa-exclamation-circle text-asatemeRed text-5xl mb-4"></i>
            <h3 class="text-xl font-bold text-asatemeBlue mb-2">Noticia no encontrada</h3>
            <p class="text-gray-600 mb-6">La publicación que estás intentando buscar no existe o fue movida.</p>
            <a href="index.html#noticias"
                class="bg-asatemeBlue text-white px-5 py-2.5 rounded-xl font-bold text-sm transition hover:bg-blue-900">Volver
                al Inicio</a>
        </div>

        <article id="noticia-article" class="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100">

            <!-- Banner Azul permanente -->
            <div id="banner-container"
                class="relative h-64 md:h-80 bg-asatemeBlue flex items-center justify-center p-8 overflow-hidden">
                <div id="banner-img-layer" class="absolute inset-0 bg-cover bg-center hidden opacity-50"></div>
                <div class="relative z-10 max-w-2xl text-center text-white">
                    <div id="logo-liga-container" class="hidden flex justify-center mb-4">
                        <img src="assets/images/Liga-Equipos.png" alt="Logo"
                            class="h-16 md:h-20 w-auto object-contain drop-shadow-md">
                    </div>
                    <h2 id="noticia-titulo" class="text-2xl md:text-4xl font-extrabold tracking-tight leading-tight">
                    </h2>
                </div>
            </div>

            <!-- Meta info -->
            <div
                class="px-6 md:px-12 py-4 bg-slate-50 border-b flex items-center gap-2 text-xs text-gray-500 font-medium">
                <i class="fas fa-calendar-alt text-asatemeRed"></i> <span id="noticia-fecha"></span>
            </div>

            <!-- Contenido Dinámico -->
            <div id="noticia-contenido" class="px-6 md:px-12 py-8 space-y-6 text-gray-700 text-base md:text-lg"></div>
        </article>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const noticiaId = urlParams.get('id');
            if (!noticiaId) return;

            fetch('data/noticias.json')
                .then(res => res.json())
                .then(noticias => {
                    const noticia = noticias.find(n => n.id === noticiaId);
                    if (!noticia) return;

                    document.getElementById('noticia-titulo').innerText = noticia.titulo;
                    document.getElementById('noticia-fecha').innerText = noticia.fecha;
                    if (noticia.mostrarLogoLiga) document.getElementById('logo-liga-container').classList.remove('hidden');

                    // Lógica Banner: solo activar capa de imagen si es válida
                    if (noticia.imagenPortada && noticia.imagenPortada.length > 5) {
                        const imgLayer = document.getElementById('banner-img-layer');
                        imgLayer.style.backgroundImage = `url('${noticia.imagenPortada}')`;
                        imgLayer.classList.remove('hidden');
                    }

                    // Renderizado de Contenido
                    const contenedor = document.getElementById('noticia-contenido');
                    noticia.contenido.forEach(b => {
                        if (b.tipo === 'parrafo') {
                            contenedor.innerHTML += `<p class="leading-relaxed">${b.texto}</p>`;
                        } else if (b.tipo === 'cita') {
                            contenedor.innerHTML += `<blockquote class="border-l-4 border-asatemeRed bg-red-50/50 p-4 rounded-r-xl italic text-asatemeBlue font-semibold">"${b.texto}"</blockquote>`;
                        } else if (b.tipo === 'tarjetaInformativa') {
                            contenedor.innerHTML += `
                                <div class="bg-slate-50 border p-5 rounded-xl flex gap-4 items-center my-6">
                                    <div class="bg-asatemeBlue text-white p-4 rounded-full w-12 h-12 flex items-center justify-center shrink-0">
                                        <i class="${b.icono}"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-asatemeBlue text-sm uppercase">${b.titulo}</h4>
                                        <p class="text-sm text-gray-600 mt-1 whitespace-pre-line">${b.text || b.texto}</p>
                                    </div>
                                </div>`;
                        }
                    });
                    
                    // 3. Lógica inteligente para mostrar 1 imagen grande o una galería
                    if (noticia.galeria && Array.isArray(noticia.galeria) && noticia.galeria.length > 0) {
                        const divFooter = document.createElement('div');
                        divFooter.className = "mt-12 pt-8 border-t border-gray-200";

                        if (noticia.galeria.length === 1) {
                            // --- CASO 1: UNA SOLA IMAGEN (Grande) ---
                            divFooter.innerHTML = `
            <div class="w-full">
                <img src="${noticia.galeria[0]}" class="w-full rounded-2xl shadow-lg border border-gray-200 object-cover">
            </div>
        `;
                        } else {
                            // --- CASO 2: VARIAS IMÁGENES (Galería en Grid) ---
                            divFooter.innerHTML = `<h3 class="text-lg font-bold text-asatemeBlue mb-4">Galería de imágenes</h3>`;
                            const grid = document.createElement('div');
                            grid.className = "grid grid-cols-2 md:grid-cols-3 gap-4";

                            noticia.galeria.forEach(imgUrl => {
                                grid.innerHTML += `
                <div class="aspect-square bg-gray-100 rounded-xl overflow-hidden border border-gray-200 shadow-sm">
                    <img src="${imgUrl}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
                </div>
            `;
                            });
                            divFooter.appendChild(grid);
                        }

                        contenedor.appendChild(divFooter);
                    }
                });
        });
    </script>
</body>

</html>
